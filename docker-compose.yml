version: '3.8'

services:
  # Base de datos MySQL para el sistema de planillas y cálculos
  mysql-db:
    image: mysql:8.0
    container_name: calculo-mysql
    restart: always
    environment:
      MYSQL_DATABASE: db_calculo_planilla
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_calculo_data:/var/lib/mysql
    networks:
      - calculo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tu aplicación Spring Boot (app-calculo)
  app-calculo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contenedor_calculo_planilla
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_calculo_planilla?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - calculo-net

volumes:
  mysql_calculo_data:

networks:
  calculo-net:
    driver: bridge